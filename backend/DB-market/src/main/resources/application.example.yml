server:
  port: 8080

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/market?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: root
    password: your_password_here

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

storage:
  local:
    # Fixed backend storage directory. The code resolves it under backend/DB-market.
    base-dir: data/storage
    public-url-prefix: /storage

# Classroom demo uses wallet balance recharge/pay/refund.
# Alipay sandbox is kept as a later extension and disabled by placeholder values.
alipay:
  appId: your_alipay_app_id
  appPrivateKey: your_app_private_key
  alipayPublicKey: your_alipay_public_key
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notifyUrl: https://your-public-domain/alipay/notify
  returnUrl: http://127.0.0.1:8080/alipay/return
